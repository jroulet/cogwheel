# DATA_CONTRACTS.yaml — Machine-readable schema for project data products.
#
# Each artifact describes a data product: who produces it, who consumes it,
# what fields it contains, and what conventions govern its format.
#
# The SDK pipeline uses this for:
#   - Inspector: verify that code changes honor producer/consumer contracts
#   - Librarian: keep documentation in sync with actual data flow
#   - Pre-commit hook: check_contract_lock verifies greppable field names
#
# Version format: MAJOR.MINOR.PATCH
#   MAJOR: incompatible schema restructuring
#   MINOR: new artifacts, conventions, or consumer/producer entries
#   PATCH: field list corrections, wording fixes

schema_version: "2.0.0"

# ── Conventions ──────────────────────────────────────────────────────────
# Define project-wide data conventions here. These are referenced by
# individual artifacts below.

conventions:
  units:
    description: "Physical units used across cogwheel data products."
    rule: >-
      Frequencies in Hz; times in GPS seconds; component masses in solar masses;
      distances in Mpc; angles in radians. Strain is dimensionless; ASDs are in
      units of 1/sqrt(Hz).
  waveform_phase_convention:
    description: "Waveform phase/spin convention."
    rule: >-
      cogwheel uses IMRPhenomXP (not IMRPhenomPv2) because Pv2 uses a different
      phase convention that throws off cogwheel's coordinates (see LIGO-T1500602).
  sampled_vs_standard:
    description: "Coordinate-system convention for parameters."
    rule: >-
      'standard' parameters are physically meaningful; 'sampled' parameters are
      reparameterizations chosen to reduce correlations. Each Prior defines the
      bijection and the Jacobian relating the two.
  array_axes:
    description: "Axis ordering for likelihood/marginalization arrays."
    rule: >-
      Frequency-domain quantities broadcast over (detector, frequency[, mode])
      axes; relative-binning summaries and coherent-score lookup tables follow
      this ordering.

# ── Artifacts ────────────────────────────────────────────────────────────

artifacts:

  posterior_samples:
    description: "Posterior parameter samples written by a Sampler run (samples.feather in the rundir)."
    format: "feather"
    producer:
      module: "cogwheel/sampling.py"
      function: "Sampler.run"
    consumers:
      - module: "cogwheel/postprocessing.py"
        function: "PostProcessor.__init__"
      - module: "cogwheel/validation/analyze.py"
        function: "_get_samples"
      - module: "cogwheel/validation/inference.py"
        function: "make_corner_plot"
    conventions_applied:
      - units
      - sampled_vs_standard

  sampler_config_json:
    description: "Serialized Sampler instance (sampler settings + embedded Posterior) written to Sampler.json in the rundir."
    format: "json"
    producer:
      module: "cogwheel/sampling.py"
      function: "Sampler.run"
    consumers:
      - module: "cogwheel/postprocessing.py"
        function: "PostProcessor.__init__"
      - module: "cogwheel/sampling.py"
        function: "main"
    conventions_applied:
      - sampled_vs_standard

  posterior_config_json:
    description: "Serialized Posterior (Prior + relative-binning Likelihood, reference solution) written to Posterior.json in the eventdir."
    format: "json"
    producer:
      module: "cogwheel/posterior.py"
      function: "Posterior.from_event"
    consumers:
      - module: "cogwheel/utils.py"
        function: "read_json"
    conventions_applied:
      - sampled_vs_standard
      - waveform_phase_convention

  postprocessing_tests_json:
    description: "Post-inference QA test results (ASD drift, relative-binning accuracy, etc.) written to postprocessing_tests.json in the rundir."
    format: "json"
    producer:
      module: "cogwheel/postprocessing.py"
      function: "PostProcessor.save"
    consumers:
      - module: "cogwheel/postprocessing.py"
        function: "PostProcessor.__init__"
      - module: "cogwheel/postprocessing.py"
        function: "PostProcessor.make_table"

  profiling_stats:
    description: "cProfile stats for a Sampler run, written to the 'profiling' file in the rundir."
    format: "cprofile"
    producer:
      module: "cogwheel/sampling.py"
      function: "Sampler.run"
    consumers:
      - module: "cogwheel/postprocessing.py"
        function: "PostProcessor.make_table"

  event_data_npz:
    description: "Serialized EventData (frequency-domain strain, whitening filter, detector names, GPS time, injection metadata). Shipped set lives at cogwheel/data/*.npz."
    format: "npz"
    producer:
      module: "cogwheel/data.py"
      function: "EventData.to_npz"
    consumers:
      - module: "cogwheel/data.py"
        function: "EventData.from_npz"
      - module: "cogwheel/likelihood/reference_waveform_finder.py"
        function: "ReferenceWaveformFinder.from_event"
      - module: "cogwheel/utils.py"
        function: "CogwheelEncoder.default"
    conventions_applied:
      - units

  example_asd_npy:
    description: "Amplitude spectral densities used for synthetic Gaussian-noise events. Shipped set at cogwheel/data/example_asds/asd_*.npy."
    format: "npy"
    producer:
      module: "(shipped with package)"
      function: "(prebuilt dataset)"
    consumers:
      - module: "cogwheel/data.py"
        function: "EventData.gaussian_noise"
    conventions_applied:
      - units

  events_metadata_csv:
    description: "Metadata for the shipped GW event dataset, loaded at cogwheel.data import time."
    format: "csv"
    producer:
      module: "(shipped with package)"
      function: "(prebuilt dataset)"
    consumers:
      - module: "cogwheel/data.py"
        function: "(module init: EVENTS_METADATA)"

  coherent_score_lookup_tables:
    description: "Cached interpolation tables for distance/phase (coherent-score) marginalization; lazily generated on first use, invalidated on version mismatch."
    format: "npz"
    producer:
      module: "cogwheel/likelihood/marginalization/lookup_table.py"
      function: "LookupTable._get_table"
    consumers:
      - module: "cogwheel/likelihood/marginalization/lookup_table.py"
        function: "LookupTable._get_table"
      - module: "cogwheel/likelihood/marginalization/base.py"
        function: "BaseCoherentScore.__init__"
    conventions_applied:
      - array_axes

  injection_set_feather:
    description: "DataFrame of injection parameters (drawn from prior, filtered by an h|h threshold) for validation studies."
    format: "feather"
    producer:
      module: "cogwheel/validation/generate_injections.py"
      function: "generate_injections"
    consumers:
      - module: "cogwheel/validation/inference.py"
        function: "_get_event_data"
      - module: "cogwheel/validation/generate_injections.py"
        function: "test_h_h_distribution"
    conventions_applied:
      - units
      - sampled_vs_standard

  injection_json:
    description: "Per-injection bookkeeping (injected par_dic, approximant, SNRs) written to injection.json in each validation rundir."
    format: "json"
    producer:
      module: "cogwheel/validation/inference.py"
      function: "main"
    consumers:
      - module: "cogwheel/validation/analyze.py"
        function: "_get_credible_intervals"
      - module: "cogwheel/validation/inference.py"
        function: "make_corner_plot"
    conventions_applied:
      - units

  lens_amplification_surrogate:
    description: "Offline-trained multi-chart cubic-spline emulator of the microlensing SACR-C amplification envelope (LensAmplificationSurrogate). Single npz with per-chart coefficient/knot arrays and a JSON provenance scalar; loaded via LensAmplificationSurrogate.load. Off by default (opt-in via the lensed likelihoods). Each near-caustic TubeChart record additionally carries a theta_to_s arc-length axis-map array of shape (2, N_map) = [theta_fine, s_fine]: the tube's fourth interpolation axis is ARC LENGTH s = integral caustic_speed dtheta along the fold arc (not raw theta), and a query theta is mapped to s through this stored map at serve time (membership and cusp-window tests remain in theta). Each ExteriorPolarChart record (the astroid interior is InteriorWedgeChart's nominal domain, see below) interpolates in caustic-fixed polar (rho, theta_c) axes where rho is the caustic-fixed radial coordinate (_to_caustic_fixed; additive exterior on both parities -- rho = 1 + |y| - reach -- and multiplicative only on the astroid interior arm) and theta_c is the caustic polar angle atan2(y2_eig, y1_eig); tile edges sit on cusp rays so no tile straddles one and no arc-length map is needed. Each such record MUST carry axis_schema='exterior_polar_rho_theta_c' (_EXTERIOR_POLAR_AXIS_SCHEMA); the loader hard-refuses an absent or unknown tag. refused_points shape (n, 3) stores (gamma, rho, theta_c) in caustic-fixed coordinates; param_spacing = [mean d gamma, mean d rho, mean d theta_c] over the uniform grids, so the exclusion-ball metric is meaningful by construction. Macro-saddle (parity != 1) exterior charts are chartable in the same caustic-fixed polar axes with an additive scalar-reach rho (rho = 1 + |y| - _caustic_reach, drho/d|y| = 1). Each LobeInteriorChart record carries axis_schema='lobe_caustic_relative_v1' (_LOBE_AXIS_SCHEMA_NEW; absent or unknown tags hard-refuse at load -- v1 is the ONLY known tag). The two OLD lobe tags, 'lobe_local_offset_rholobe_thetalocal_framewinv' (V1, raw theta_local spline) and 'lobe_local_offset_rholobe_thetalocal_sqrtedge_framewinv' (sqrt-edge s-coordinate), are both DROPPED from the known set, so a stale V1 or sqrt-edge artifact hard-refuses at load rather than being served on the wrong angular coordinate. The lobe chart's fourth interpolation axis is the cusp-adapted coordinate u = d**(2/3), d the angular distance to the NEAREST deltoid cusp vertex (the macro-saddle counterpart of the wedge's cusp-adapted axis), mapped from theta_local at serve time through the REQUIRED theta_to_u map of shape (2, 2001) = [theta_fine, u_fine] (built UNIFORM in u by _lobe_cusp_axis_map; read unconditionally at load, so an absent map hard-refuses with KeyError). Each InteriorWedgeChart record carries axis_schema='wedge_caustic_relative_v3' (_WEDGE_AXIS_SCHEMA; absent or unknown tags hard-refuse at load -- v3 is the ONLY known tag. v1 (the genuinely arc-length angular axis) and v2 (the SAME cusp-adapted u axis as v3, but serialized under arc-length field names) are both DROPPED from the known set, so a stale v1 artifact cannot mis-serve at the wrong angular coordinate and a stale v2 artifact cannot mis-serve under the wrong field names). Axes are (log w, gamma, r, theta_wedge) where r = |y_eig| / r_caustic(gamma, theta_wedge) in [0, 1] and theta_wedge = atan2(|y2_eig|, |y1_eig|) in [0, pi/2] (D2 fold; one quadrant trained, all four served by symmetry fold-in at query time). real_coeffs/imag_coeffs are the B-spline tensors over those four axes; wedge_map (_WedgeCausticMap) is the precomputed caustic-radius lookup table; refused_points shape (n, 3) stores (gamma, r, theta_wedge) in wedge-fixed coordinates; theta_to_u shape (2, 2001) = [theta_wedge_fine, u_fine] is the cusp-adapted angular axis map (v3; the identical array was serialized as theta_to_s under v2, a name that recorded the symbol's first use rather than its role -- u is rad**(2/3), NOT an arc length) -- u = d**(2/3) where d is the angular distance to the NEAR astroid cusp (theta_wedge = 0 or pi/2), the tile's angular span lying entirely on one side of the per-band caustic waist theta_waist = argmin_theta r_caustic(gamma, theta) (`_wedge_theta_waist`) so the map uses the matching near-cusp origin (`_wedge_cusp_axis_map`, built uniform in u, NOT the retired v1 arc length s = integral caustic_speed dtheta): from_wedge_engine always builds and stores it; theta_to_u is REQUIRED under v3 -- it is read unconditionally at load and an absent map hard-refuses, retiring the v2 tolerance for pre-56a223a artifacts along with the v2 tag. u_grid (shape (n_theta_wedge,)) is derived as np.interp of the training theta_wedge_grid through theta_to_u; the spline's 4th axis is u_grid rather than raw theta_wedge, concentrating knots near the tile's near cusp. The w axis is capped: from_wedge_engine clips w_max to _DD_PRODUCT_MARGIN / (r_max * reach_max) before building log_w_grid, so every stored node satisfies w * r * r_caustic < 58 = _DD_PRODUCT_MARGIN by construction; the cap is NOT recorded as a separate field but is recoverable from the serialized log_w_grid[-1]. The envelope is tau_c-demodulated INTERIOR_SACR_C."
    format: "npz"
    producer:
      module: "scripts/train_lens_surrogate.py"
      function: "main"
    consumers:
      - module: "cogwheel/lensing/likelihood.py"
        function: "LensedRelativeBinningLikelihood"
      - module: "cogwheel/lensing/marginalized_likelihood.py"
        function: "LensedMarginalizedExtrinsicLikelihood"
      - module: "cogwheel/lensing/surrogate_census.py"
        function: "run"
    conventions_applied:
      - units
      - array_axes

  pearcey_table:
    description: "Precomputed bicubic-spline table of the Fresnel-demodulated universal Pearcey primitive P(x, y) over a build-time-derived (x, y) box. Single npz of graded grid axes plus demodulated Re/Im grids and a JSON provenance scalar (box edges, overlap margin, oracle tolerance, SHA1 content hash); loaded and hash-verified via PearceyTable.load. Off by default (opt-in via set_pearcey_table / use_pearcey_table); the cusp arm consults it inside the box and falls back to live certified quadrature outside the box or on any load/hash anomaly. Controls (x, y) are dimensionless scaled cusp controls, so no physical-unit convention applies."
    format: "npz"
    producer:
      module: "scripts/train_pearcey_table.py"
      function: "main"
    consumers:
      - module: "cogwheel/lensing/chang_refsdal/_pearcey_cusp.py"
        function: "cusp_amplification"
      - module: "cogwheel/lensing/chang_refsdal/_pearcey_cusp.py"
        function: "use_pearcey_table"

  certified_ppgo_map:
    description: "Hash-pinned lookup of the certified-ppGO frequency floor w_cert per (parity, gamma-band, caustic-frame annulus rho=|y|/caustic_reach) cell. Single npz (schema 0.2.0) of the parity codes, gamma-band and annulus edges, and per-cell w_cert (the sup-over-w floor at the 1e-4 F-normalized bar), diagnostic w_cert (1e-3 probe bar), w_ceiling, status codes, interpolability flags and rho_measured_max, plus a JSON provenance scalar (grid bounds, certification bar, safety-margin rule w_trust=max(1.5*w_cert, w_cert+2.0), w_ceiling_rule, rho_measured_max_rule, walls, SHA1 content hash over all grids incl. w_ceiling and rho_measured_max); loaded and hash-verified via CertifiedPpgoMap.load. TRUNCATION-ON-REFUSAL: a monotone saddle-image-branch refusal part-way up a cell's w sweep truncates that angle at its maximal accepted w-prefix instead of invalidating the whole cell; the cell certifies on its measured range and carries a finite w_ceiling = min over angles of each angle's max accepted w (a certified cell is trusted only on [w_cert, w_ceiling], beyond it is UNKNOWN). OUTER-ANNULUS CAP: the open outer annulus [4.0, inf) is sampled at one finite radius, so each cell carries rho_measured_max (band top edge for inner annuli; lo*1.5 for the open outer annulus) and every accessor returns UNKNOWN for a query rho beyond it (no infinite-annulus certification from one finite sample). The loader HARD-REFUSES a map lacking the w_ceiling or rho_measured_max grids (KeyError -> use_certified_ppgo_map returns False, global stays None). Off by default (opt-in via set_certified_ppgo_map / use_certified_ppgo_map); the band-split dispatch queries w_cert/w_trust/w_ceiling to place the ppGO-vs-chart split at min(parity_wall, w_ceiling) and refuses / charts on the UNKNOWN sentinel (beyond-wall, invalid, out-of-grid, beyond rho_measured_max, or no map installed). w is dimensionless frequency; gamma is external shear magnitude; rho is the dimensionless caustic-frame annulus radius."
    format: "npz"
    producer:
      module: "scripts/train_ppgo_map.py"
      function: "main"
    consumers:
      - module: "cogwheel/lensing/ppgo_map.py"
        function: "use_certified_ppgo_map"
      - module: "cogwheel/lensing/likelihood.py"
        function: "LensedRelativeBinningLikelihood._ppgo_band_split"
      - module: "cogwheel/lensing/surrogate_training.py"
        function: "train"

  born_residual_chart:
    description: "Trained Born-exterior residual interpolation artifact shipped as package data at cogwheel/data/born_residual_chart.npz. Holds a 3-D tensor-product cubic spline of the Born residual R(w; gamma, rho) = F_exact_demod(w) - F_carrier_demod(w) over a sparse grid (7 gamma × 5 rho × 10 log-w nodes) covering the far exterior (rho > 2) on both parities. All values are in the min-relative delay frame (same frame as ChangRefsdalPartition.exact_total and born_carrier_from_partition). Fields: gamma_grid (1-D, ascending), rho_grid (1-D, ascending, all > 1.0), log_w_grid (1-D, ascending, natural log of dimensionless frequency), real_coeffs (3-D, shape n_gamma × n_rho × n_w), imag_coeffs (3-D, same shape), provenance (JSON-compatible dict with training date, driver version, accuracy stats). Loaded and served via BornResidualChart (frozen dataclass, cogwheel/lensing/born_residual_chart.py); the fact-4 slot in likelihood._surrogate_coefficients attaches it at construction time. When attached, exterior draws are served as F_carrier + R without running the exact engine. When None (default), exterior draws fall through to the exact engine. Training runtime approx 11 s (scripts/train_born_residual.py, 7 × 5 × 10 grid). w, gamma, rho are all dimensionless."
    format: "npz"
    producer:
      module: "scripts/train_born_residual.py"
      function: "main"
    consumers:
      - module: "cogwheel/lensing/likelihood.py"
        function: "LensedRelativeBinningLikelihood._surrogate_coefficients"
