  pearcey_table:
    description: "Precomputed bicubic-spline table of the Fresnel-demodulated universal Pearcey primitive P(x, y) over a build-time-derived (x, y) box. Single npz of graded grid axes plus demodulated Re/Im grids and a JSON provenance scalar (box edges, overlap margin, oracle tolerance, SHA1 content hash); loaded and hash-verified via PearceyTable.load. Off by default (opt-in via set_pearcey_table / use_pearcey_table); the cusp arm consults it inside the box and falls back to live certified quadrature outside the box or on any load/hash anomaly. Controls (x, y) are dimensionless scaled cusp controls, so no physical-unit convention applies."
    format: "npz"
    producer:
      module: "scripts/train_pearcey_table.py"
      function: "main"
    consumers:
      - module: "cogwheel/lensing/chang_refsdal/_pearcey_cusp.py"
        function: "cusp_amplification"
      - module: "cogwheel/lensing/chang_refsdal/_pearcey_cusp.py"
        function: "use_pearcey_table"

  certified_ppgo_map:
    description: "Hash-pinned lookup of the certified-ppGO frequency floor w_cert per (parity, gamma-band, caustic-frame annulus rho=|y|/caustic_reach) cell. Single npz (schema 0.2.0) of the parity codes, gamma-band and annulus edges, and per-cell w_cert (the sup-over-w floor at the 1e-4 F-normalized bar), diagnostic w_cert (1e-3 probe bar), w_ceiling, status codes, interpolability flags and rho_measured_max, plus a JSON provenance scalar (grid bounds, certification bar, safety-margin rule w_trust=max(1.5*w_cert, w_cert+2.0), w_ceiling_rule, rho_measured_max_rule, walls, SHA1 content hash over all grids incl. w_ceiling and rho_measured_max); loaded and hash-verified via CertifiedPpgoMap.load. TRUNCATION-ON-REFUSAL: a monotone saddle-image-branch refusal part-way up a cell's w sweep truncates that angle at its maximal accepted w-prefix instead of invalidating the whole cell; the cell certifies on its measured range and carries a finite w_ceiling = min over angles of each angle's max accepted w (a certified cell is trusted only on [w_cert, w_ceiling], beyond it is UNKNOWN). OUTER-ANNULUS CAP: the open outer annulus [4.0, inf) is sampled at one finite radius, so each cell carries rho_measured_max (band top edge for inner annuli; lo*1.5 for the open outer annulus) and every accessor returns UNKNOWN for a query rho beyond it (no infinite-annulus certification from one finite sample). SADDLE RHO<1 RELAXATION (F080): a certified saddle cell with rho < 1 is UNKNOWN by default (the single-center-sample certification cannot be trusted near the deltoid lobes without cell-specific re-validation); `CertifiedPpgoMap._saddle_rho_relaxed_floor` (`ppgo_map.py`) is the sole authority that lifts this, matching the query cell against the hardcoded evidence-keyed `_SADDLE_RHO_RELAXED_CELLS` allowlist by EXACT gamma/rho edge equality (a re-grid whose edges no longer match falls back to UNKNOWN, never mis-serves) and serving `max(w_cert, effective_floor)` only for an allowlisted cell; as of the F080 re-validation only one cell (gamma [1.157, 1.339], rho [0, 0.5]) is allowlisted, at floor 19.164 (w_trust 28.746). `w_cert`, `w_trust`, and `w_ceiling` all route through this same allowlist, so they stay mutually consistent. This is the single authoritative source for the saddle rho<1 serve/refuse decision; the former redundant pre-guards in `likelihood.LensedRelativeBinningLikelihood._ppgo_cell_coords` and `surrogate_census.characterize_sample` (both unconditionally forced rho to None / returned None for saddle rho<1) were deleted as duplicates once the map itself owned the decision. The loader HARD-REFUSES a map lacking the w_ceiling or rho_measured_max grids (KeyError -> use_certified_ppgo_map returns False, global stays None). Off by default (opt-in via set_certified_ppgo_map / use_certified_ppgo_map); the band-split dispatch queries w_cert/w_trust/w_ceiling to place the ppGO-vs-chart split at min(parity_wall, w_ceiling) and refuses / charts on the UNKNOWN sentinel (beyond-wall, invalid, out-of-grid, beyond rho_measured_max, or no map installed). w is dimensionless frequency; gamma is external shear magnitude; rho is the dimensionless caustic-frame annulus radius."
    format: "npz"
    producer:
      module: "scripts/train_ppgo_map.py"
      function: "main"
    consumers:
      - module: "cogwheel/lensing/ppgo_map.py"
        function: "use_certified_ppgo_map"
      - module: "cogwheel/lensing/likelihood.py"
        function: "LensedRelativeBinningLikelihood._ppgo_band_split"
      - module: "cogwheel/lensing/surrogate_training.py"
        function: "train"
      # Test consumers (kind: test) -- exercise the loader/round-trip
      # contract directly, not production callers. Registered 2026-08-13
      # to clear the consumer_graph advisory (Librarian post-commit sync).
      - module: "cogwheel/tests/test_lensing_saddle_rho_guards.py"
        function: "CensusBandSplitMirrorIntegrityTestCase.setUpClass"
        kind: test
      - module: "cogwheel/tests/test_lensing_ppgo_bandsplit.py"
        function: "LoaderCeilingRefusalTestCase.test_ceiling_less_artifact_is_hard_refused"
        kind: test
      - module: "cogwheel/tests/test_lensing_ppgo_bandsplit.py"
        function: "LoaderCeilingRefusalTestCase.test_tampered_ceiling_value_is_hard_refused"
        kind: test
      - module: "cogwheel/tests/test_lensing_ppgo_bandsplit.py"
        function: "MapRefusalTestCase.test_corrupt_and_absent_artifacts_refuse_loudly"
        kind: test
      - module: "cogwheel/tests/test_lensing_saddle_rho_guards.py"
        function: "PpgoMapDefenseInDepthSelfFalsificationTestCase.setUpClass"
        kind: test
      - module: "cogwheel/tests/test_lensing_saddle_rho_guards.py"
        function: "PpgoMapDefenseInDepthTestCase.setUpClass"
        kind: test

  born_residual_chart:
    description: "Trained Born-exterior residual interpolation artifact shipped as package data at cogwheel/data/born_residual_chart.npz. Holds a 3-D tensor-product cubic spline of the Born residual R(w; gamma, rho) = F_exact_demod(w) - F_carrier_demod(w) over a sparse grid (7 gamma × 5 rho × 10 log-w nodes) covering the far exterior (rho > 2) on both parities. All values are in the min-relative delay frame (same frame as ChangRefsdalPartition.exact_total and born_carrier_from_partition). Fields: gamma_grid (1-D, ascending), rho_grid (1-D, ascending, all > 1.0), log_w_grid (1-D, ascending, natural log of dimensionless frequency), real_coeffs (3-D, shape n_gamma × n_rho × n_w), imag_coeffs (3-D, same shape), provenance (JSON-compatible dict with training date, driver version, accuracy stats). Loaded and served via BornResidualChart (frozen dataclass, cogwheel/lensing/born_residual_chart.py). It is auto-loaded through BornResidualChart.load() and attached at LensedRelativeBinningLikelihood construction time (the `_AUTO_BORN_CHART` sentinel default, refusing to None on any load anomaly); pass an explicit born_residual_chart=None to opt out and keep the pure-engine path. LensedMarginalizedExtrinsicLikelihood's internal LensedRelativeBinningLikelihood engine inherits the same auto-attach default. When attached, the chart is consulted by the first-class Born intercept LensedRelativeBinningLikelihood._born_residual_analytic inside _amplification_coefficients, which serves the exterior directly as F_carrier + R (surrogate-free) under the gate kappa == 0 AND beta == 0 AND caustic-frame rho = caustic_rho(...) > 2.0 (far exterior, both parities) AND born_chart.covers(gamma, rho), and band-splits the dense w band against the certified ppGO map (Born carrier + residual at or below the trusted floor w_trust, bare point-mass ppGO above). On any gate miss (kappa != 0, beta != 0, rho <= 2, uncovered cell, or explicit None) the draw falls through to the exact engine. Training runtime approx 11 s (scripts/train_born_residual.py, 7 × 5 × 10 grid). w, gamma, rho are all dimensionless."
    format: "npz"
    producer:
      module: "scripts/train_born_residual.py"
      function: "main"
    consumers:
      - module: "cogwheel/lensing/likelihood.py"
        function: "LensedRelativeBinningLikelihood._born_residual_analytic"
      - module: "cogwheel/lensing/likelihood.py"
        function: "LensedRelativeBinningLikelihood._surrogate_coefficients"
