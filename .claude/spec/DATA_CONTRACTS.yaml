# DATA_CONTRACTS.yaml — Machine-readable schema for project data products.
#
# Each artifact describes a data product: who produces it, who consumes it,
# what fields it contains, and what conventions govern its format.
#
# The SDK pipeline uses this for:
#   - Inspector: verify that code changes honor producer/consumer contracts
#   - Librarian: keep documentation in sync with actual data flow
#   - Pre-commit hook: check_contract_lock verifies greppable field names
#
# Version format: MAJOR.MINOR.PATCH
#   MAJOR: incompatible schema restructuring
#   MINOR: new artifacts, conventions, or consumer/producer entries
#   PATCH: field list corrections, wording fixes

schema_version: "0.4.0"

# ── Conventions ──────────────────────────────────────────────────────────
# Define project-wide data conventions here. These are referenced by
# individual artifacts below.

conventions:
  units:
    description: "Physical units used across cogwheel data products."
    rule: >-
      Frequencies in Hz; times in GPS seconds; component masses in solar masses;
      distances in Mpc; angles in radians. Strain is dimensionless; ASDs are in
      units of 1/sqrt(Hz).
  waveform_phase_convention:
    description: "Waveform phase/spin convention."
    rule: >-
      cogwheel uses IMRPhenomXP (not IMRPhenomPv2) because Pv2 uses a different
      phase convention that throws off cogwheel's coordinates (see LIGO-T1500602).
  sampled_vs_standard:
    description: "Coordinate-system convention for parameters."
    rule: >-
      'standard' parameters are physically meaningful; 'sampled' parameters are
      reparameterizations chosen to reduce correlations. Each Prior defines the
      bijection and the Jacobian relating the two.
  array_axes:
    description: "Axis ordering for likelihood/marginalization arrays."
    rule: >-
      Frequency-domain quantities broadcast over (detector, frequency[, mode])
      axes; relative-binning summaries and coherent-score lookup tables follow
      this ordering.

# ── Artifacts ────────────────────────────────────────────────────────────

artifacts:

  posterior_samples:
    description: "Posterior parameter samples written by a Sampler run (samples.feather in the rundir)."
    format: "feather"
    producer:
      module: "cogwheel/sampling.py"
      function: "Sampler.run"
    consumers:
      - module: "cogwheel/postprocessing.py"
        function: "PostProcessor.__init__"
      - module: "cogwheel/validation/analyze.py"
        function: "_get_samples"
      - module: "cogwheel/validation/inference.py"
        function: "make_corner_plot"
    conventions_applied:
      - units
      - sampled_vs_standard

  sampler_config_json:
    description: "Serialized Sampler instance (sampler settings + embedded Posterior) written to Sampler.json in the rundir."
    format: "json"
    producer:
      module: "cogwheel/sampling.py"
      function: "Sampler.run"
    consumers:
      - module: "cogwheel/postprocessing.py"
        function: "PostProcessor.__init__"
      - module: "cogwheel/sampling.py"
        function: "main"
    conventions_applied:
      - sampled_vs_standard

  posterior_config_json:
    description: "Serialized Posterior (Prior + relative-binning Likelihood, reference solution) written to Posterior.json in the eventdir."
    format: "json"
    producer:
      module: "cogwheel/posterior.py"
      function: "Posterior.from_event"
    consumers:
      - module: "cogwheel/utils.py"
        function: "read_json"
    conventions_applied:
      - sampled_vs_standard
      - waveform_phase_convention

  postprocessing_tests_json:
    description: "Post-inference QA test results (ASD drift, relative-binning accuracy, etc.) written to postprocessing_tests.json in the rundir."
    format: "json"
    producer:
      module: "cogwheel/postprocessing.py"
      function: "PostProcessor.save"
    consumers:
      - module: "cogwheel/postprocessing.py"
        function: "PostProcessor.__init__"
      - module: "cogwheel/postprocessing.py"
        function: "PostProcessor.make_table"

  profiling_stats:
    description: "cProfile stats for a Sampler run, written to the 'profiling' file in the rundir."
    format: "cprofile"
    producer:
      module: "cogwheel/sampling.py"
      function: "Sampler.run"
    consumers:
      - module: "cogwheel/postprocessing.py"
        function: "PostProcessor.make_table"

  event_data_npz:
    description: "Serialized EventData (frequency-domain strain, whitening filter, detector names, GPS time, injection metadata). Shipped set lives at cogwheel/data/*.npz."
    format: "npz"
    producer:
      module: "cogwheel/data.py"
      function: "EventData.to_npz"
    consumers:
      - module: "cogwheel/data.py"
        function: "EventData.from_npz"
      - module: "cogwheel/likelihood/reference_waveform_finder.py"
        function: "ReferenceWaveformFinder.from_event"
      - module: "cogwheel/utils.py"
        function: "CogwheelEncoder.default"
    conventions_applied:
      - units

  example_asd_npy:
    description: "Amplitude spectral densities used for synthetic Gaussian-noise events. Shipped set at cogwheel/data/example_asds/asd_*.npy."
    format: "npy"
    producer:
      module: "(shipped with package)"
      function: "(prebuilt dataset)"
    consumers:
      - module: "cogwheel/data.py"
        function: "EventData.gaussian_noise"
    conventions_applied:
      - units

  events_metadata_csv:
    description: "Metadata for the shipped GW event dataset, loaded at cogwheel.data import time."
    format: "csv"
    producer:
      module: "(shipped with package)"
      function: "(prebuilt dataset)"
    consumers:
      - module: "cogwheel/data.py"
        function: "(module init: EVENTS_METADATA)"

  coherent_score_lookup_tables:
    description: "Cached interpolation tables for distance/phase (coherent-score) marginalization; lazily generated on first use, invalidated on version mismatch."
    format: "npz"
    producer:
      module: "cogwheel/likelihood/marginalization/lookup_table.py"
      function: "LookupTable._get_table"
    consumers:
      - module: "cogwheel/likelihood/marginalization/lookup_table.py"
        function: "LookupTable._get_table"
      - module: "cogwheel/likelihood/marginalization/base.py"
        function: "BaseCoherentScore.__init__"
    conventions_applied:
      - array_axes

  injection_set_feather:
    description: "DataFrame of injection parameters (drawn from prior, filtered by an h|h threshold) for validation studies."
    format: "feather"
    producer:
      module: "cogwheel/validation/generate_injections.py"
      function: "generate_injections"
    consumers:
      - module: "cogwheel/validation/inference.py"
        function: "_get_event_data"
      - module: "cogwheel/validation/generate_injections.py"
        function: "test_h_h_distribution"
    conventions_applied:
      - units
      - sampled_vs_standard

  injection_json:
    description: "Per-injection bookkeeping (injected par_dic, approximant, SNRs) written to injection.json in each validation rundir."
    format: "json"
    producer:
      module: "cogwheel/validation/inference.py"
      function: "main"
    consumers:
      - module: "cogwheel/validation/analyze.py"
        function: "_get_credible_intervals"
      - module: "cogwheel/validation/inference.py"
        function: "make_corner_plot"
    conventions_applied:
      - units

  lens_amplification_surrogate:
    description: "Offline-trained multi-chart cubic-spline emulator of the microlensing SACR-C amplification envelope (LensAmplificationSurrogate). Single npz with per-chart coefficient/knot arrays and a JSON provenance scalar; loaded via LensAmplificationSurrogate.load. Off by default (opt-in via the lensed likelihoods). Each near-caustic TubeChart record additionally carries a theta_to_s arc-length axis-map array of shape (2, N_map) = [theta_fine, s_fine]: the tube's fourth interpolation axis is ARC LENGTH s = integral caustic_speed dtheta along the fold arc (not raw theta), and a query theta is mapped to s through this stored map at serve time (membership and cusp-window tests remain in theta). Each FarFieldChart record (exterior far-field and interior SACR-C alike) interpolates over the FAR-FIELD-SMOOTH coordinate (s, d) as its two spatial axes -- s = caustic ARC LENGTH (tangential, dimensionless source-plane y units) and d = SIGNED perpendicular distance to the nearest caustic fold (radial; d > 0 outside the caustic, d < 0 inside) -- replacing the retired caustic-fixed (rho, theta_c) axes. Each such record MUST carry axis_schema='farfield_arclength_s_perp_d_framewinv'; LensAmplificationSurrogate.load validates that required tag against the current far-field schema before reconstructing a chart and hard-refuses an absent or unknown tag, so stale raw, caustic-fixed, or wrong-frame artifacts cannot mis-serve. The chart stores a REQUIRED gamma-resolved arc_map: a 2-D monotone theta<->s table serialized as arc_gamma_nodes (n_gamma ascending shears, the spline's own gamma grid), arc_theta_fine (N_map ascending eigenframe caustic polar angles), and arc_s_table (n_gamma x N_map cumulative arc length, each row strictly increasing from 0), plus scalar arc_branch/theta_lo/theta_hi in the record meta; s is evaluated at the query's OWN gamma by linear-in-gamma interpolation between the two bracketing rows. A source's (s, d) is computed at serve time from the eigenframe position via the nearest caustic foot at the query gamma. refused_points are stored in the SAME (s, d) coordinate (columns [gamma, s, d]) and param_spacing = [mean d gamma, mean d s, mean d d] over the uniform (gamma, s, d) grids, so the refusal exclusion ball is measured in the coordinate the grid lives in. Macro-saddle (parity != 1) far-field is NOT charted in (s, d) yet (origin-centred rho and fold-adapted d disagree on 'outside' across the two disconnected deltoids) and is served by the exact engine -- an owed per-deltoid-edge redesign. Each LobeInteriorChart record carries an axis_schema tag: 'lobe_local_offset_rholobe_thetalocal_framewinv' (V1, raw theta_local spline; theta_to_s array absent or optional) or 'lobe_local_offset_rholobe_thetalocal_sqrtedge_framewinv' (current, sqrt-edge s-coordinate spline; theta_to_s array of shape (2, 2001) = [theta_fine, s_fine] required). When theta_to_s is present, the spline's fourth axis is s = sqrt(span) - sqrt(theta_max - theta_local), concentrating nodes near the wedge cusp; a query theta_local is mapped to s through this stored map at serve time. Unknown schema tags hard-refuse at load; V1 tolerates an absent theta_to_s."
    format: "npz"
    producer:
      module: "scripts/train_lens_surrogate.py"
      function: "main"
    consumers:
      - module: "cogwheel/lensing/likelihood.py"
        function: "LensedRelativeBinningLikelihood"
      - module: "cogwheel/lensing/marginalized_likelihood.py"
        function: "LensedMarginalizedExtrinsicLikelihood"
      - module: "cogwheel/lensing/surrogate_census.py"
        function: "run"
    conventions_applied:
      - units
      - array_axes

  pearcey_table:
    description: "Precomputed bicubic-spline table of the Fresnel-demodulated universal Pearcey primitive P(x, y) over a build-time-derived (x, y) box. Single npz of graded grid axes plus demodulated Re/Im grids and a JSON provenance scalar (box edges, overlap margin, oracle tolerance, SHA1 content hash); loaded and hash-verified via PearceyTable.load. Off by default (opt-in via set_pearcey_table / use_pearcey_table); the cusp arm consults it inside the box and falls back to live certified quadrature outside the box or on any load/hash anomaly. Controls (x, y) are dimensionless scaled cusp controls, so no physical-unit convention applies."
    format: "npz"
    producer:
      module: "scripts/train_pearcey_table.py"
      function: "main"
    consumers:
      - module: "cogwheel/lensing/chang_refsdal/_pearcey_cusp.py"
        function: "cusp_amplification"
      - module: "cogwheel/lensing/chang_refsdal/_pearcey_cusp.py"
        function: "use_pearcey_table"

  certified_ppgo_map:
    description: "Hash-pinned lookup of the certified-ppGO frequency floor w_cert per (parity, gamma-band, caustic-frame annulus rho=|y|/caustic_reach) cell. Single npz (schema 0.2.0) of the parity codes, gamma-band and annulus edges, and per-cell w_cert (the sup-over-w floor at the 1e-4 F-normalized bar), diagnostic w_cert (1e-3 probe bar), w_ceiling, status codes, interpolability flags and rho_measured_max, plus a JSON provenance scalar (grid bounds, certification bar, safety-margin rule w_trust=max(1.5*w_cert, w_cert+2.0), w_ceiling_rule, rho_measured_max_rule, walls, SHA1 content hash over all grids incl. w_ceiling and rho_measured_max); loaded and hash-verified via CertifiedPpgoMap.load. TRUNCATION-ON-REFUSAL: a monotone saddle-image-branch refusal part-way up a cell's w sweep truncates that angle at its maximal accepted w-prefix instead of invalidating the whole cell; the cell certifies on its measured range and carries a finite w_ceiling = min over angles of each angle's max accepted w (a certified cell is trusted only on [w_cert, w_ceiling], beyond it is UNKNOWN). OUTER-ANNULUS CAP: the open outer annulus [4.0, inf) is sampled at one finite radius, so each cell carries rho_measured_max (band top edge for inner annuli; lo*1.5 for the open outer annulus) and every accessor returns UNKNOWN for a query rho beyond it (no infinite-annulus certification from one finite sample). The loader HARD-REFUSES a map lacking the w_ceiling or rho_measured_max grids (KeyError -> use_certified_ppgo_map returns False, global stays None). Off by default (opt-in via set_certified_ppgo_map / use_certified_ppgo_map); the band-split dispatch queries w_cert/w_trust/w_ceiling to place the ppGO-vs-chart split at min(parity_wall, w_ceiling) and refuses / charts on the UNKNOWN sentinel (beyond-wall, invalid, out-of-grid, beyond rho_measured_max, or no map installed). w is dimensionless frequency; gamma is external shear magnitude; rho is the dimensionless caustic-frame annulus radius."
    format: "npz"
    producer:
      module: "scripts/train_ppgo_map.py"
      function: "main"
    consumers:
      - module: "cogwheel/lensing/ppgo_map.py"
        function: "use_certified_ppgo_map"
      - module: "cogwheel/lensing/likelihood.py"
        function: "LensedRelativeBinningLikelihood._ppgo_band_split"
      - module: "cogwheel/lensing/surrogate_training.py"
        function: "train"
