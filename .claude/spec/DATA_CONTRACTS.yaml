# DATA_CONTRACTS.yaml — Machine-readable schema for project data products.
#
# Each artifact describes a data product: who produces it, who consumes it,
# what fields it contains, and what conventions govern its format.
#
# The SDK pipeline uses this for:
#   - Inspector: verify that code changes honor producer/consumer contracts
#   - Librarian: keep documentation in sync with actual data flow
#   - Pre-commit hook: check_contract_lock verifies greppable field names
#
# Version format: MAJOR.MINOR.PATCH
#   MAJOR: incompatible schema restructuring
#   MINOR: new artifacts, conventions, or consumer/producer entries
#   PATCH: field list corrections, wording fixes

schema_version: "3.2.0"

# ── Conventions ──────────────────────────────────────────────────────────
# Define project-wide data conventions here. These are referenced by
# individual artifacts below.

conventions:
  units:
    description: "Physical units used across cogwheel data products."
    rule: >-
      Frequencies in Hz; times in GPS seconds; component masses in solar masses;
      distances in Mpc; angles in radians. Strain is dimensionless; ASDs are in
      units of 1/sqrt(Hz).
  waveform_phase_convention:
    description: "Waveform phase/spin convention."
    rule: >-
      cogwheel uses IMRPhenomXP (not IMRPhenomPv2) because Pv2 uses a different
      phase convention that throws off cogwheel's coordinates (see LIGO-T1500602).
  sampled_vs_standard:
    description: "Coordinate-system convention for parameters."
    rule: >-
      'standard' parameters are physically meaningful; 'sampled' parameters are
      reparameterizations chosen to reduce correlations. Each Prior defines the
      bijection and the Jacobian relating the two.
  array_axes:
    description: "Axis ordering for likelihood/marginalization arrays."
    rule: >-
      Frequency-domain quantities broadcast over (detector, frequency[, mode])
      axes; relative-binning summaries and coherent-score lookup tables follow
      this ordering.

# ── Artifacts ────────────────────────────────────────────────────────────

artifacts:

  posterior_samples:
    description: "Posterior parameter samples written by a Sampler run (samples.feather in the rundir)."
    format: "feather"
    producer:
      module: "cogwheel/sampling.py"
      function: "Sampler.run"
    consumers:
      - module: "cogwheel/postprocessing.py"
        function: "PostProcessor.__init__"
      - module: "cogwheel/validation/analyze.py"
        function: "_get_samples"
      - module: "cogwheel/validation/inference.py"
        function: "make_corner_plot"
    conventions_applied:
      - units
      - sampled_vs_standard

  sampler_config_json:
    description: "Serialized Sampler instance (sampler settings + embedded Posterior) written to Sampler.json in the rundir."
    format: "json"
    producer:
      module: "cogwheel/sampling.py"
      function: "Sampler.run"
    consumers:
      - module: "cogwheel/postprocessing.py"
        function: "PostProcessor.__init__"
      - module: "cogwheel/sampling.py"
        function: "main"
    conventions_applied:
      - sampled_vs_standard

  posterior_config_json:
    description: "Serialized Posterior (Prior + relative-binning Likelihood, reference solution) written to Posterior.json in the eventdir."
    format: "json"
    producer:
      module: "cogwheel/posterior.py"
      function: "Posterior.from_event"
    consumers:
      - module: "cogwheel/utils.py"
        function: "read_json"
    conventions_applied:
      - sampled_vs_standard
      - waveform_phase_convention

  postprocessing_tests_json:
    description: "Post-inference QA test results (ASD drift, relative-binning accuracy, etc.) written to postprocessing_tests.json in the rundir."
    format: "json"
    producer:
      module: "cogwheel/postprocessing.py"
      function: "PostProcessor.save"
    consumers:
      - module: "cogwheel/postprocessing.py"
        function: "PostProcessor.__init__"
      - module: "cogwheel/postprocessing.py"
        function: "PostProcessor.make_table"

  profiling_stats:
    description: "cProfile stats for a Sampler run, written to the 'profiling' file in the rundir."
    format: "cprofile"
    producer:
      module: "cogwheel/sampling.py"
      function: "Sampler.run"
    consumers:
      - module: "cogwheel/postprocessing.py"
        function: "PostProcessor.make_table"

  event_data_npz:
    description: "Serialized EventData (frequency-domain strain, whitening filter, detector names, GPS time, injection metadata). Shipped set lives at cogwheel/data/*.npz."
    format: "npz"
    producer:
      module: "cogwheel/data.py"
      function: "EventData.to_npz"
    consumers:
      - module: "cogwheel/data.py"
        function: "EventData.from_npz"
      - module: "cogwheel/likelihood/reference_waveform_finder.py"
        function: "ReferenceWaveformFinder.from_event"
      - module: "cogwheel/utils.py"
        function: "CogwheelEncoder.default"
    conventions_applied:
      - units

  example_asd_npy:
    description: "Amplitude spectral densities used for synthetic Gaussian-noise events. Shipped set at cogwheel/data/example_asds/asd_*.npy."
    format: "npy"
    producer:
      module: "(shipped with package)"
      function: "(prebuilt dataset)"
    consumers:
      - module: "cogwheel/data.py"
        function: "EventData.gaussian_noise"
    conventions_applied:
      - units

  events_metadata_csv:
    description: "Metadata for the shipped GW event dataset, loaded at cogwheel.data import time."
    format: "csv"
    producer:
      module: "(shipped with package)"
      function: "(prebuilt dataset)"
    consumers:
      - module: "cogwheel/data.py"
        function: "(module init: EVENTS_METADATA)"

  coherent_score_lookup_tables:
    description: "Cached interpolation tables for distance/phase (coherent-score) marginalization; lazily generated on first use, invalidated on version mismatch."
    format: "npz"
    producer:
      module: "cogwheel/likelihood/marginalization/lookup_table.py"
      function: "LookupTable._get_table"
    consumers:
      - module: "cogwheel/likelihood/marginalization/lookup_table.py"
        function: "LookupTable._get_table"
      - module: "cogwheel/likelihood/marginalization/base.py"
        function: "BaseCoherentScore.__init__"
    conventions_applied:
      - array_axes

  injection_set_feather:
    description: "DataFrame of injection parameters (drawn from prior, filtered by an h|h threshold) for validation studies."
    format: "feather"
    producer:
      module: "cogwheel/validation/generate_injections.py"
      function: "generate_injections"
    consumers:
      - module: "cogwheel/validation/inference.py"
        function: "_get_event_data"
      - module: "cogwheel/validation/generate_injections.py"
        function: "test_h_h_distribution"
    conventions_applied:
      - units
      - sampled_vs_standard

  injection_json:
    description: "Per-injection bookkeeping (injected par_dic, approximant, SNRs) written to injection.json in each validation rundir."
    format: "json"
    producer:
      module: "cogwheel/validation/inference.py"
      function: "main"
    consumers:
      - module: "cogwheel/validation/analyze.py"
        function: "_get_credible_intervals"
      - module: "cogwheel/validation/inference.py"
        function: "make_corner_plot"
    conventions_applied:
      - units

  lens_amplification_surrogate:
    description: "Offline-trained multi-chart cubic-spline emulator of the microlensing SACR-C amplification envelope (LensAmplificationSurrogate). Single npz with per-chart coefficient/knot arrays and a JSON provenance scalar; loaded via LensAmplificationSurrogate.load. Off by default (opt-in via the lensed likelihoods). Each near-caustic TubeChart record additionally carries a theta_to_s arc-length axis-map array of shape (2, N_map) = [theta_fine, s_fine]: the tube's fourth interpolation axis is ARC LENGTH s = integral caustic_speed dtheta along the fold arc (not raw theta), and a query theta is mapped to s through this stored map at serve time (membership and cusp-window tests remain in theta). Each ExteriorPolarChart record (the astroid interior is InteriorWedgeChart's nominal domain, see below) interpolates in caustic-fixed polar (rho, theta_c) axes where rho is the caustic-fixed radial coordinate (_to_caustic_fixed; additive exterior on both parities -- rho = 1 + |y| - reach -- and multiplicative only on the astroid interior arm) and theta_c is the caustic polar angle atan2(y2_eig, y1_eig); tile edges sit on cusp rays so no tile straddles one and no arc-length map is needed (the optional angular-axis map is cusp-adapted, not arc-length). Each such record MUST carry one of the two known axis_schema tags: 'exterior_polar_rho_log_carrier_v1' (_EXTERIOR_POLAR_AXIS_SCHEMA_V4; retained for backward compatibility) or 'exterior_polar_rho_u_carrier_v2' (_EXTERIOR_POLAR_AXIS_SCHEMA_V5; the current write tag) -- the retired 'exterior_polar_rho_theta_c', 'exterior_polar_rho_u_v1', 'exterior_polar_carrier_demod_v2', and 'exterior_polar_rho_log_v3' schemas are dropped from the known set, so stale raw-theta, v1, v2, or v3 artifacts hard-refuse at load rather than serving on the wrong coordinate, without carrier demodulation, or without rho-axis conditioning). Each ExteriorPolarChart additionally carries a carrier_rate field (float, default 0.0): the residual carrier-phase rate k_chart estimated from per-node unwrapped-phase slope; when nonzero, the stored envelope is demodulated by exp(-1j*k_chart*w) before spline fitting (single canonical site: from_values) and re-modulated at serve, absorbing the ~1000x dynamic range of |E(w)| ~ w**(-0.60). Each ExteriorPolarChart also carries rho_log_axis (bool, default False): when True, the rho spline axis is reparameterized to ur = log(rho-1), linearizing the ~4.5-decade envelope magnitude growth toward rho=1 (applied at from_values before spline fitting; inverted transparently at serve). Each ExteriorPolarChart optionally carries rho_u_carrier (np.ndarray or None, default None): when not None, an (n_rho, n_theta_c) array of fold-carrier delays Re(tau_c(rho, u)) -- the fold-merge-point delay -- at every (rho, u) spline node; the stored envelope was first demodulated by exp(-1j*w*rho_u_carrier[rho, u]) before the carrier_rate demodulation at from_values, and serve re-modulates in reverse order (carrier_rate first, then the rho_u_carrier delay bilinearly interpolated at the query u-coordinate, never raw theta_c). Old 1-D rho_carrier artifacts load by broadcasting to 2-D (backward-compatible). Positive-parity (parity == 1) exterior charts optionally carry a theta_to_u map of shape (2, 2001) = [theta_c_fine, u_fine] -- the cusp-adapted angular axis u = d**(2/3), d the angular distance to the NEAR caustic cusp (0 or pi/2 in the D2-folded quadrant), built UNIFORM in u by the shared _wedge_cusp_axis_map and used as the spline's 4th axis (u_grid derived as np.interp of the training theta_c_grid through the map), concentrating knots near the tile's near cusp. ExteriorPolarChart charts POSITIVE PARITY ONLY -- the macro-saddle (parity == -1) exterior is charted separately as LobeExteriorChart (see below), not as an ExteriorPolarChart on raw theta_c. An absent theta_to_u loads as None (raw-theta fallback), preserving NPZ round-trip for a map-less chart. refused_points shape (n, 3) stores (gamma, rho, theta_c) in caustic-fixed coordinates; param_spacing = [mean d gamma, mean d rho, mean d theta_c] over the uniform grids, so the exclusion-ball metric is meaningful by construction. Macro-saddle (parity != 1) exterior coverage is NOT chartable in these origin-centred polar axes: the two deltoid lobes sit off the origin and neither encloses it, so a single origin-ray crosses EXT(2img) -> INT(4img lobe) -> EXT(2img), making an origin-polar coordinate topologically ill-posed there; it is charted per lobe as LobeExteriorChart instead (see below). Each LobeInteriorChart record carries axis_schema='lobe_caustic_relative_v1' (_LOBE_AXIS_SCHEMA_NEW; absent or unknown tags hard-refuse at load -- v1 is the ONLY known tag). The two OLD lobe tags, 'lobe_local_offset_rholobe_thetalocal_framewinv' (V1, raw theta_local spline) and 'lobe_local_offset_rholobe_thetalocal_sqrtedge_framewinv' (sqrt-edge s-coordinate), are both DROPPED from the known set, so a stale V1 or sqrt-edge artifact hard-refuses at load rather than being served on the wrong angular coordinate. The lobe chart's fourth interpolation axis is the cusp-adapted coordinate u = d**(2/3), d the angular distance to the NEAREST deltoid cusp vertex (the macro-saddle counterpart of the wedge's cusp-adapted axis), mapped from theta_local at serve time through the REQUIRED theta_to_u map of shape (2, 2001) = [theta_fine, u_fine] (built UNIFORM in u by _lobe_cusp_axis_map; read unconditionally at load, so an absent map hard-refuses with KeyError). Each LobeExteriorChart record is the exterior sibling of LobeInteriorChart: it shares the lobe-local (rho_lobe, theta_local) frame but over the EXTERIOR shell rho_lobe in (1, rho_outer] (rho_lobe = 1 traces the deltoid boundary), the SAME axis_schema tag lobe_caustic_relative_v1 (_LOBE_AXIS_SCHEMA_NEW; absent or unknown tags hard-refuse at load), and NPZ kind tag 'lobe_exterior'. Unlike LobeInteriorChart it has NO other_centroid / corridor_half inter-lobe corridor fields (the bulk exterior is a single well-posed region per lobe centroid; the D2 reflection fold lets the canonical +y1 lobe's exterior chart serve the whole inter-lobe corridor) and no fold-carrier field. It stores image_count = _MACRO_SADDLE_EXTERIOR_IMAGE_COUNT = 2 (the two-image real-saddle sum) and the FARFIELD_KERNEL_SUM far-field envelope label (envelope_definition) rather than the interior tau_c-demodulated INTERIOR_SACR_C label. Its theta_to_u map, when present, is the SAME cusp-adapted u = d**(2/3) coordinate built by _lobe_cusp_axis_map; it is OPTIONAL -- an absent lobe_exterior theta_to_u key loads as None via a soft data.get (the raw-theta fallback, built when the training producer from_lobe_exterior_engine is called with cusp_angle=None). Trained via LensAmplificationSurrogate.from_lobe_exterior_engine; 'lobe_exterior' is a first-class training region (scripts/train_lens_surrogate.py --regions lobe_exterior), included in the default regions tuple. select_chart tries LOBE-INTERIOR before LOBE-EXTERIOR before WEDGE-INTERIOR (a lobe-interior box, rho_lobe <= 1, and a lobe-exterior box, rho_lobe > 1, never overlap); a gated or carrier-flipped LobeExteriorChart tile has no subdivider and is recorded as a ladder-served gap rather than recursively subdivided. Each InteriorWedgeChart record carries axis_schema='wedge_caustic_relative_v3' (_WEDGE_AXIS_SCHEMA; absent or unknown tags hard-refuse at load -- v3 is the ONLY known tag. v1 (the genuinely arc-length angular axis) and v2 (the SAME cusp-adapted u axis as v3, but serialized under arc-length field names) are both DROPPED from the known set, so a stale v1 artifact cannot mis-serve at the wrong angular coordinate and a stale v2 artifact cannot mis-serve under the wrong field names). Axes are (log w, gamma, r, theta_wedge) where r = |y_eig| / r_caustic(gamma, theta_wedge) in [0, 1] and theta_wedge = atan2(|y2_eig|, |y1_eig|) in [0, pi/2] (D2 fold; one quadrant trained, all four served by symmetry fold-in at query time). real_coeffs/imag_coeffs are the B-spline tensors over those four axes; wedge_map (_WedgeCausticMap) is the precomputed caustic-radius lookup table; refused_points shape (n, 3) stores (gamma, r, theta_wedge) in wedge-fixed coordinates; theta_to_u shape (2, 2001) = [theta_wedge_fine, u_fine] is the cusp-adapted angular axis map (v3; the identical array was serialized as theta_to_s under v2, a name that recorded the symbol's first use rather than its role -- u is rad**(2/3), NOT an arc length) -- u = d**(2/3) where d is the angular distance to the NEAR astroid cusp (theta_wedge = 0 or pi/2), the tile's angular span lying entirely on one side of the per-band caustic waist theta_waist = argmin_theta r_caustic(gamma, theta) (`_wedge_theta_waist`) so the map uses the matching near-cusp origin (`_wedge_cusp_axis_map`, built uniform in u, NOT the retired v1 arc length s = integral caustic_speed dtheta): from_wedge_engine always builds and stores it; theta_to_u is REQUIRED under v3 -- it is read unconditionally at load and an absent map hard-refuses, retiring the v2 tolerance for pre-56a223a artifacts along with the v2 tag. u_grid (shape (n_theta_wedge,)) is derived as np.interp of the training theta_wedge_grid through theta_to_u; the spline's 4th axis is u_grid rather than raw theta_wedge, concentrating knots near the tile's near cusp. The w axis is capped: from_wedge_engine clips w_max to _DD_PRODUCT_MARGIN / (r_max * reach_max) before building log_w_grid, so every stored node satisfies w * r * r_caustic < 58 = _DD_PRODUCT_MARGIN by construction; the cap is NOT recorded as a separate field but is recoverable from the serialized log_w_grid[-1]. The envelope is tau_c-demodulated INTERIOR_SACR_C."
    format: "npz"
    producer:
      module: "scripts/train_lens_surrogate.py"
      function: "main"
    consumers:
      - module: "cogwheel/lensing/likelihood.py"
        function: "LensedRelativeBinningLikelihood"
      - module: "cogwheel/lensing/marginalized_likelihood.py"
        function: "LensedMarginalizedExtrinsicLikelihood"
      - module: "cogwheel/lensing/surrogate_census.py"
        function: "run"
      # Test consumers (kind: test) -- exercise the loader/round-trip
      # contract directly, not production callers. Registered 2026-08-13
      # to clear the consumer_graph advisory (Librarian post-commit sync).
      - module: "cogwheel/tests/test_lensing_surrogate.py"
        function: "AstroidByteIdentityTestCase.test_astroid_exterior_polar_npz_round_trip_is_bit_identical"
